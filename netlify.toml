[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."gsheet-smart"]
  timeout = 26

[functions."gsheet-discover"]
  timeout = 15

[functions."ai-map"]
  timeout = 15

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200